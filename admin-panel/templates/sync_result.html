<!doctype html>
<html>
<head>
  <title>Sync Result</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #14161a; color: #e8e8e8; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #1f2229; padding: 1rem 1.5rem; border-radius: 8px; margin-bottom: 0.8rem; }
    .ok { color: #6dd47e; }
    .error { color: #ff6b6b; }
    a { color: #7ba7ff; }
  </style>
</head>
<body>
  <h1>Sync results</h1>
  {% for r in results %}
  <div class="card">
    <strong>{{ r.step }}</strong> —
    <span class="{{ 'error' if r.status == 'error' else 'ok' }}">{{ r.status }}</span>
    {% if r.detail %}<div style="font-size:0.85rem; color:#999; margin-top:0.4rem;">{{ r.detail }}</div>{% endif %}
  </div>
  {% endfor %}
  <a href="/">&larr; Back</a>
</body>
</html>
